<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Tasks</h1>
            <p>Keep track of your daily goals</p>
        </header>

        <section class="task-form-card">
            <form id="task-form">
                <div class="form-group">
                    <input type="text" id="task-title" placeholder="What needs to be done?" required>
                </div>
                <div class="form-group">
                    <textarea id="task-desc" placeholder="Add some details (optional)"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label for="task-date">Due Date</label>
                        <input type="date" id="task-date">
                    </div>
                    <div class="form-group half">
                        <label for="task-category">Category</label>
                        <select id="task-category">
                            <option value="General">General</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health">Health</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="add-btn">Add Task</button>
            </form>
        </section>

        <section class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </section>

        <section id="task-list" class="task-list">
            <!-- Tasks will be injected here -->
            <div class="loader">Loading tasks...</div>
        </section>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h2>Edit Task</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <input type="text" id="edit-title" required>
                </div>
                <div class="form-group">
                    <textarea id="edit-desc"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Due Date</label>
                        <input type="date" id="edit-date">
                    </div>
                    <div class="form-group half">
                        <label>Category</label>
                        <select id="edit-category">
                            <option value="General">General</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health">Health</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="save-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
